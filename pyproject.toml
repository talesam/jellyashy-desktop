[project]
name = "jellyashy-desktop"
description = "JellyAshy for the Linux desktop: your Jellyfin movies and series, with mpv playing them."
dynamic = ["version"]
authors = [
    { name = "Tales A. Mendonça", email = "talesam@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyGObject",
    "python-mpv",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Display",
]

[project.urls]
Homepage = "https://jellyashy.talesam.org"
Source = "https://github.com/talesam/jellyashy-desktop"
Issues = "https://github.com/talesam/jellyashy-desktop/issues"

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/jellyashy_desktop/__init__.py"
pattern = 'APP_VERSION = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/jellyashy_desktop"]

[tool.hatch.build.targets.wheel.shared-data]
"usr/share" = "share"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM105"]
